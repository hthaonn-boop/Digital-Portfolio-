<body class="bg-[#f8fafc] text-[#334155] font-sans antialiased min-h-screen flex flex-col">

    <!-- Image Popup -->
    <div id="imageModal"
        class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-[9999] flex items-center justify-center transition-all duration-300 opacity-0"
        onclick="closeModal()">

        <!-- Close Button -->
        <button
            class="absolute top-6 right-6 text-white/70 hover:text-white transition-all bg-white/10 hover:bg-white/20 w-12 h-12 rounded-full flex items-center justify-center focus:outline-none"
            onclick="closeModal(); event.stopPropagation();">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>

        <!-- Left Arrow -->
        <button id="modalPrevBtn"
            class="absolute left-4 md:left-8 text-white/70 hover:text-white transition-all bg-white/10 hover:bg-white/20 w-14 h-14 rounded-full flex items-center justify-center focus:outline-none"
            onclick="prevImage(event)">
            <i class="fa-solid fa-chevron-left text-xl"></i>
        </button>

        <!-- Image Container -->
        <div class="max-w-[85%] max-h-[85%] flex items-center justify-center overflow-hidden"
            onclick="event.stopPropagation();">
            <img id="modalImg"
                class="max-w-full max-h-[85vh] rounded-xl shadow-2xl object-contain border border-white/10 transition-all duration-300 transform translate-x-0 opacity-0">
        </div>

        <!-- Right Arrow -->
        <button id="modalNextBtn"
            class="absolute right-4 md:right-8 text-white/70 hover:text-white transition-all bg-white/10 hover:bg-white/20 w-14 h-14 rounded-full flex items-center justify-center focus:outline-none"
            onclick="nextImage(event)">
            <i class="fa-solid fa-chevron-right text-xl"></i>
        </button>

        <!-- Image Counter -->
        <div id="modalCounter"
            class="absolute bottom-6 text-white/60 text-sm font-medium bg-slate-900/60 px-4 py-1.5 rounded-full backdrop-blur-sm">
            1 / 5
        </div>
    </div>

    <!-- GIAO DIỆN HIỂN THỊ CHÍNH (HÃY CHÈN PHẦN BODY CHỨA ẢNH CỦA BẠN VÀO ĐÂY) -->
    <main class="flex-grow p-8 max-w-6xl mx-auto w-full">
        <h1 class="font-serif text-4xl font-bold mb-4 text-slate-900">Nguyễn Thị Hương Thảo - 25117038</h1>
        <p class="font-casual text-mint-600 mb-8">Digital Portfolio</p>

        <!-- Ví dụ về một lưới hiển thị ảnh hoạt động tốt với code bên dưới -->
        <!-- Bạn chỉ cần chắc chắn thẻ img có: onclick="openModal(this)" -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="overflow-hidden rounded-xl border bg-white p-2 shadow-sm">
                <img src="Portfolio (1)/anh1.png" alt="Dự án 1" class="w-full h-64 object-cover rounded-lg cursor-pointer" onclick="openModal(this)">
            </div>
            <div class="overflow-hidden rounded-xl border bg-white p-2 shadow-sm">
                <img src="Portfolio (1)/anh2.png" alt="Dự án 2" class="w-full h-64 object-cover rounded-lg cursor-pointer" onclick="openModal(this)">
            </div>
        </div>
    </main>

    <script>
        let currentGalleryImages = [];
        let currentImageIndex = 0;

        function openModal(element) {
            // Lấy trực tiếp thuộc tính tương đối từ code html để tránh dính mã file:/// cục bộ
            let src = typeof element === 'string' ? element : element.getAttribute('src'); 
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImg");

            modal.classList.remove("hidden");

            setTimeout(() => {
                modal.classList.remove("opacity-0");
                modal.classList.add("opacity-100");
                modalImg.setAttribute('src', src);
                modalImg.classList.remove("opacity-0");
                modalImg.classList.add("opacity-100", "translate-x-0");
            }, 10);

            if (typeof element !== 'string') {
                const parentContainer = element.closest('.grid') || element.parentElement;
                currentGalleryImages = Array.from(parentContainer.querySelectorAll('img[onclick*="openModal"]'));
                currentImageIndex = currentGalleryImages.indexOf(element);
            } else {
                currentGalleryImages = Array.from(document.querySelectorAll('img[onclick*="openModal"]'));
                currentImageIndex = currentGalleryImages.findIndex(img => img.getAttribute('src') === src);
            }

            updateModalGallery();
            document.addEventListener('keydown', handleKeyDown);
        }

        function closeModal() {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImg");

            modal.classList.remove("opacity-100");
            modal.classList.add("opacity-0");
            modalImg.classList.remove("opacity-100");
            modalImg.classList.add("opacity-0");

            setTimeout(() => {
                modal.classList.add("hidden");
            }, 300);

            document.removeEventListener('keydown', handleKeyDown);
        }

        function updateModalGallery() {
            const prevBtn = document.getElementById("modalPrevBtn");
            const nextBtn = document.getElementById("modalNextBtn");
            const counter = document.getElementById("modalCounter");

            if (currentGalleryImages.length <= 1) {
                prevBtn.classList.add("hidden");
                nextBtn.classList.add("hidden");
                counter.classList.add("hidden");
                return;
            }

            prevBtn.classList.remove("hidden");
            nextBtn.classList.remove("hidden");
            counter.classList.remove("hidden");

            counter.innerText = (currentImageIndex + 1) + " / " + currentGalleryImages.length;
        }

        function nextImage(event) {
            if (event) event.stopPropagation();
            if (currentGalleryImages.length <= 1) return;

            const modalImg = document.getElementById("modalImg");
            modalImg.classList.remove("translate-x-0", "opacity-100");
            modalImg.classList.add("translate-x-[-100px]", "opacity-0");

            setTimeout(() => {
                currentImageIndex = (currentImageIndex + 1) % currentGalleryImages.length;
                let nextSrc = currentGalleryImages[currentImageIndex].getAttribute('src');
                modalImg.setAttribute('src', nextSrc);
                modalImg.classList.remove("translate-x-[-100px]", "opacity-0");
                modalImg.classList.add("translate-x-0", "opacity-100");
            }, 100);
        }

        function prevImage(event) {
            if (event) event.stopPropagation();
            if (currentGalleryImages.length <= 1) return;

            const modalImg = document.getElementById("modalImg");
            modalImg.classList.remove("translate-x-0", "opacity-100");
            modalImg.classList.add("translate-x-[100px]", "opacity-0");

            setTimeout(() => {
                currentImageIndex = (currentImageIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
                let prevSrc = currentGalleryImages[currentImageIndex].getAttribute('src');
